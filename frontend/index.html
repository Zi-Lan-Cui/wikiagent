<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>wiki-agent</title>
    <link rel="stylesheet" href="/style.css?v=18" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <h1>wiki-agent</h1>
          <button id="new-session" class="primary-button" type="button">＋ 新对话</button>
        </div>
        <div id="session-list" class="session-list" aria-label="历史会话"></div>
        <details class="sidebar-section">
          <summary><span>当前 Wiki 文件</span><span class="summary-action">浏览 <b class="section-chevron">›</b></span></summary>
          <div id="wiki-files" class="wiki-files" aria-label="当前 Wiki 文件"></div>
        </details>
        <button id="issue-center-open" class="sidebar-destination" type="button">
          <span><b>工作台</b><small>运行任务、问题与质量提醒</small></span>
          <span class="summary-action"><b id="queue-count" class="section-count">0</b><b class="section-chevron">›</b></span>
        </button>
      </aside>

      <main class="chat-panel">
        <header class="chat-header">
          <div>
            <p class="eyebrow">本地知识库助手</p>
            <h2 id="session-title">选择一个会话</h2>
          </div>
          <div class="header-actions">
            <span id="connection-status" class="status">准备就绪</span>
          </div>
        </header>

        <section id="messages" class="messages" aria-live="polite">
          <div class="empty-state">创建或选择一个会话，然后开始提问。</div>
        </section>

        <section id="wiki-viewer" class="wiki-viewer" hidden aria-live="polite">
          <div class="wiki-viewer-toolbar">
            <div class="wiki-history-controls" role="group" aria-label="Wiki 浏览历史">
              <button id="wiki-history-back" class="wiki-nav-button" type="button" aria-label="后退" title="后退 (Alt+←)" disabled>←</button>
              <button id="wiki-history-forward" class="wiki-nav-button" type="button" aria-label="前进" title="前进 (Alt+→)" disabled>→</button>
            </div>
            <button id="wiki-close" class="wiki-close-button" type="button" title="直接返回当前会话 (Esc)">返回会话</button>
          </div>
          <header class="wiki-page-header">
            <span id="wiki-viewer-path" class="wiki-viewer-path"></span>
            <h3 id="wiki-page-title"></h3>
            <p id="wiki-summary" class="wiki-summary"></p>
            <div id="wiki-basic" class="wiki-meta-basic" aria-label="页面基础信息"></div>
            <div id="wiki-metadata" class="wiki-metadata" aria-label="页面元信息"></div>
          </header>
          <article id="wiki-content" class="wiki-content markdown"></article>
        </section>

        <section id="issue-center" class="issue-center" hidden aria-live="polite">
          <header class="issue-center-header">
            <div>
              <p class="eyebrow">知识库运行与维护</p>
              <h2>工作台</h2>
              <p>分别查看后台任务和需要处理的问题。</p>
            </div>
            <button id="issue-center-close" class="ghost-button" type="button">返回会话</button>
          </header>
          <div class="workbench-tabs" role="tablist" aria-label="工作台视图">
            <button id="workbench-tab-tasks" type="button" role="tab" aria-controls="workbench-tasks-panel">
              运行任务 <span id="workbench-task-tab-count">0</span>
            </button>
            <button id="workbench-tab-issues" class="active" type="button" role="tab" aria-controls="workbench-issues-panel" aria-selected="true">
              问题处理 <span id="workbench-issue-tab-count">0</span>
            </button>
          </div>
          <section id="workbench-tasks-panel" class="workbench-panel task-panel" role="tabpanel" hidden>
            <section class="issue-task-queue" aria-labelledby="issue-task-heading">
              <header>
                <div>
                  <h3 id="issue-task-heading">运行队列</h3>
                  <p>等待任务会按顺序执行，避免同时修改 Wiki。</p>
                </div>
                <span id="issue-task-count" class="issue-task-count">0 个活动任务</span>
              </header>
              <div id="issue-task-list" class="issue-task-list" aria-live="polite"></div>
            </section>
          </section>
          <section id="workbench-issues-panel" class="workbench-panel issue-panel" role="tabpanel">
            <div class="issue-filters" aria-label="问题筛选">
              <label>状态
                <select id="issue-status-filter">
                  <option value="open,blocked">未结束</option>
                  <option value="open">待处理</option>
                  <option value="blocked">等待决策</option>
                  <option value="resolved,dismissed">已结束</option>
                  <option value="">全部</option>
                </select>
              </label>
              <label>类型
                <select id="issue-kind-filter">
                  <option value="">全部类型</option>
                  <option value="ingestion_failure">资料处理失败</option>
                  <option value="content_correction">用户纠错</option>
                  <option value="quality_issue">质量问题</option>
                  <option value="run_failure">运行失败</option>
                </select>
              </label>
              <button id="retry-eligible" class="bulk-retry" type="button" disabled>
                一键重试 <span id="retry-eligible-count">0</span>
              </button>
              <button id="sync-now" class="bulk-retry" type="button" title="拍一次源目录快照并入队编译">
                同步 <span id="sync-badge">0</span>
              </button>
            </div>
            <div class="issue-workspace">
              <div id="issue-list" class="issue-list" aria-label="问题列表"></div>
              <article id="issue-detail" class="issue-detail">
                <div class="issue-detail-empty">选择一个问题查看证据与可用操作。</div>
              </article>
            </div>
          </section>
        </section>

        <form id="message-form" class="composer">
          <textarea id="message-input" rows="2" placeholder="询问你的知识库……" disabled></textarea>
          <button id="send-button" class="primary-button" type="submit" disabled>发送</button>
        </form>
      </main>
    </div>
    <script src="/app.js?v=27" defer></script>
  </body>
</html>
