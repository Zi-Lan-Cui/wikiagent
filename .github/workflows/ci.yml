name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality and package smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          version: latest

      - name: Install locked dependencies
        run: uv sync --locked --group dev

      - name: Print CI environment
        run: |
          set -eux
          echo "commit=$(git rev-parse HEAD)"
          git status --short
          python --version
          uv --version
          uv run ruff --version
          uv run pyright --version
          uv run pytest --version
          echo '--- ruff configuration ---'
          uv run ruff check --show-settings scripts/compile_sources.py | sed -n '1,200p'

      - name: Verify tracked source and Ruff import rules
        run: |
          set -eux
          test -f pyproject.toml
          test -f scripts/compile_sources.py
          uv run ruff check . --select I --output-format=concise

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run pyright

      - name: Run tests
        run: uv run pytest -q

      - name: Build wheel and source distribution
        run: uv build

      - name: Install wheel in a clean virtual environment
        shell: bash
        run: |
          smoke_dir="$(mktemp -d)"
          uv venv "$smoke_dir"
          uv pip install --python "$smoke_dir/bin/python" dist/*.whl
          "$smoke_dir/bin/wiki-agent" --help

          sample_wiki="$(mktemp -d)"
          mkdir -p "$sample_wiki/concepts"
          cat > "$sample_wiki/concepts/example.md" <<'EOF'
          ---
          type: concept
          title: Example
          summary: A sample page for the installation smoke test
          goal: Verify that an installed package can scan a Wiki directory
          related: []
          ---

          # Example

          This synthetic page verifies the installed package without using a
          project dataset or any personal notes.
          EOF
          "$smoke_dir/bin/python" - "$sample_wiki" <<'PY'
          import sys
          from pathlib import Path

          from wiki_agent.wiki.quality import scan_wiki

          issues = scan_wiki(Path(sys.argv[1]))
          errors = [issue for issue in issues if issue.level == "error"]
          if errors:
              raise SystemExit("scan smoke test failed: " + "; ".join(map(str, errors)))
          print(f"scan smoke test passed ({len(issues)} warnings/issues)")
          PY

      - name: Collect failure diagnostics
        if: failure()
        run: |
          set +e
          echo "commit=$(git rev-parse HEAD)"
          git status --short
          uv run ruff check . --output-format=full
          uv run pyright
